<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Feed Diário — Economia, Tech &amp; Ações</title>

  <!-- Configurações de PWA e tela inicial do iPhone (iOS) -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Feed Diário" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#090d16" />

  <!-- Ícone em SVG data-URI para tela inicial do iPhone -->
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%23111827'/%3E%3Cstop offset='100%25' stop-color='%23090d16'/%3E%3C/linearGradient%3E%3ClinearGradient id='acc' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23bg)'/%3E%3Crect x='24' y='24' width='464' height='464' rx='92' fill='none' stroke='%23ffffff' stroke-opacity='0.08' stroke-width='4'/%3E%3Crect x='116' y='136' width='280' height='36' rx='18' fill='url(%23acc)'/%3E%3Crect x='116' y='208' width='210' height='28' rx='14' fill='%23e2e8f0' fill-opacity='0.85'/%3E%3Crect x='116' y='264' width='248' height='28' rx='14' fill='%2394a3b8' fill-opacity='0.55'/%3E%3Ccircle cx='380' cy='346' r='34' fill='%2310b981' fill-opacity='0.2'/%3E%3Ccircle cx='380' cy='346' r='16' fill='%2334d399'/%3E%3C/svg%3E" />

  <!-- Fonte Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          colors: {
            obsidian: '#090d16',
            surface: '#111827',
            surfaceElevated: '#182234',
          },
        },
      },
    };
  </script>

  <style>
    :root {
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
      --sal: env(safe-area-inset-left, 0px);
      --sar: env(safe-area-inset-right, 0px);
    }

    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      background-color: #090d16;
      color: #f8fafc;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      overscroll-behavior-y: none;
    }

    .safe-top {
      padding-top: calc(var(--sat) + 12px);
    }

    .safe-bottom {
      padding-bottom: calc(var(--sab) + 8px);
    }

    .main-scroll-container {
      padding-bottom: calc(var(--sab) + 92px);
    }

    .glass-bar {
      background: rgba(9, 13, 22, 0.86);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes spinSmooth {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-smooth {
      animation: spinSmooth 0.85s linear infinite;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(16px) scale(0.985);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.24s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-obsidian text-slate-100 antialiased selection:bg-sky-500/30 selection:text-sky-200">

  <!-- Toast discreto de feedback -->
  <div id="toast-banner"
       class="fixed left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-200"
       style="bottom: calc(var(--sab) + 82px);">
    <div id="toast-text"
         class="px-4 py-2 rounded-full bg-surfaceElevated/95 border border-sky-400/30 text-xs font-medium text-sky-200 shadow-2xl backdrop-blur-md whitespace-nowrap">
      Atualizado
    </div>
  </div>

  <!-- Indicador visual de Pull-to-Refresh no topo -->
  <div id="ptr-indicator"
       class="fixed top-0 left-0 right-0 z-40 flex items-center justify-center pointer-events-none transition-transform duration-150 ease-out"
       style="transform: translateY(-72px); padding-top: var(--sat);">
    <div id="ptr-pill"
         class="mt-3 px-4 py-2 rounded-full bg-surfaceElevated/95 border border-white/10 shadow-xl flex items-center gap-2.5 text-xs font-medium text-slate-200 backdrop-blur-md">
      <svg id="ptr-icon" class="w-4 h-4 text-sky-400 transition-transform duration-150" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
      </svg>
      <span id="ptr-text">Puxe para atualizar</span>
    </div>
  </div>

  <!-- Cabeçalho fixo superior -->
  <header class="fixed top-0 left-0 right-0 z-30 glass-bar border-b border-white/[0.07] safe-top">
    <div class="max-w-2xl mx-auto px-4 pb-3 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <div class="flex items-center gap-2">
          <span id="source-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 shrink-0"></span>
          <h1 id="header-title" class="text-lg font-bold tracking-tight text-white truncate">InfoMoney</h1>
        </div>
        <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-400 truncate">
          <span id="cache-status-text">Verificando cache...</span>
          <span id="fallback-badge" class="hidden px-1.5 py-0.5 rounded bg-amber-500/15 text-amber-300 border border-amber-500/25 text-[10px] font-medium shrink-0">
            Modo exemplo
          </span>
        </div>
      </div>

      <!-- Ações do topo -->
      <div class="flex items-center gap-2 shrink-0">
        <button id="btn-install-guide"
                type="button"
                aria-label="Como instalar no iPhone"
                title="Instalar na tela inicial do iPhone"
                class="p-2.5 rounded-xl bg-white/[0.06] hover:bg-white/[0.11] active:scale-95 text-slate-200 border border-white/[0.08] transition flex items-center justify-center">
          <svg class="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0l-4 4m4-4l4 4M4 17v1a2 2 0 002 2h12a2 2 0 002-2v-1" />
          </svg>
        </button>

        <button id="btn-refresh"
                type="button"
                aria-label="Atualizar dados"
                title="Forçar atualização agora"
                class="px-3.5 py-2.5 rounded-xl bg-sky-500/15 hover:bg-sky-500/25 active:scale-95 text-sky-300 border border-sky-400/25 transition flex items-center gap-1.5 text-xs font-semibold">
          <svg id="refresh-icon" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          <span id="refresh-label">Atualizar</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Conteúdo principal rolável -->
  <main id="main-content" class="max-w-2xl mx-auto px-4 main-scroll-container" style="padding-top: calc(var(--sat) + 76px);">

    <!-- SEÇÃO 1: NOTÍCIAS (InfoMoney, Tecnoblog, MacMagazine) -->
    <section id="news-section">
      <!-- Barra de busca rápida nas manchetes -->
      <div class="mb-3.5 relative">
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 103.5 10.5a7.5 7.5 0 0013.15 6.15z" />
        </svg>
        <input id="news-search-input"
               type="search"
               placeholder="Filtrar manchetes desta aba..."
               autocomplete="off"
               class="w-full pl-10 pr-9 py-2.5 rounded-2xl bg-surface border border-white/[0.08] text-xs sm:text-sm text-white placeholder-slate-400 focus:outline-none focus:border-sky-400/50 transition" />
        <button id="btn-clear-search"
                type="button"
                aria-label="Limpar busca"
                class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 p-1 rounded-lg text-slate-400 hover:text-white">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round
